name: Appium Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable tmate SSH debugging session for Appium Inspector'
        required: false
        type: boolean
        default: false

jobs:
  build-and-test:
    name: Build & Run Appium Tests (Hybrid Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Maven project (compile check)
        run: mvn clean compile -B

      - name: Run Hybrid Docker Tests (Host Emulator + Docker Appium/Tests)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          avd-name: test_device
          force-avd-creation: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 600
          script: >
            adb devices &&
            adb shell getprop ro.build.version.sdk &&
            adb kill-server &&
            adb -a -P 5037 server nodaemon & ADB_PID=$! &&
            sleep 2 &&
            adb devices &&
            adb install -r src/test/resources/apps/MyDemoApp.apk &&
            adb shell am start -n com.saucelabs.mydemoapp.android/.view.activities.SplashActivity || true &&
            sleep 5 &&
            adb shell am force-stop com.saucelabs.mydemoapp.android || true &&
            docker compose up --build --abort-on-container-exit 2>&1 | tee docker-output.log;
            TEST_EXIT=${PIPESTATUS[0]};
            echo "TEST_EXIT=$TEST_EXIT" >> $GITHUB_ENV;
            kill $ADB_PID || true;
            exit 0


      - name: Generate Allure report (host)
        if: always()
        run: mvn allure:report -B 2>/dev/null || true

      - name: Capture Docker logs
        if: always()
        run: |
          docker compose logs appium > docker-appium.log 2>&1 || true
          docker compose logs tests > docker-tests.log 2>&1 || true

      - name: Stop Docker containers
        if: always()
        run: docker compose down --volumes --remove-orphans || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 14

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            docker-output.log
            docker-appium.log
            docker-tests.log
          retention-days: 7

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/screenshots/
          retention-days: 7

      - name: Test Results Summary
        if: always()
        run: |
          echo "## 🐳 Hybrid Docker CI Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Architecture: **Host Native Emulator** + **Dockerized Appium (\`appium/appium\`)** + **Dockerized Maven Tests**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "target/surefire-reports" ]; then
            TESTS=$(grep -r 'tests=' target/surefire-reports/TEST-*.xml 2>/dev/null | grep -oP 'tests="\K[0-9]+' | paste -sd+ | bc 2>/dev/null || echo "N/A")
            FAILURES=$(grep -r 'failures=' target/surefire-reports/TEST-*.xml 2>/dev/null | grep -oP 'failures="\K[0-9]+' | paste -sd+ | bc 2>/dev/null || echo "N/A")
            ERRORS=$(grep -r 'errors=' target/surefire-reports/TEST-*.xml 2>/dev/null | grep -oP 'errors="\K[0-9]+' | paste -sd+ | bc 2>/dev/null || echo "N/A")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Tests | $TESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| Failures | $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No test reports found." >> $GITHUB_STEP_SUMMARY
          fi

