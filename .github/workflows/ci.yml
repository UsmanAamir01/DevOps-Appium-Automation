name: Appium Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Run Appium Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Pin JAVA_HOME to JDK 17
        run: |
          echo "JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> $GITHUB_ENV
          echo "PATH=${{ steps.setup-java.outputs.path }}/bin:$PATH" >> $GITHUB_ENV

      - name: Verify Java version
        run: java -version && javac -version && echo "JAVA_HOME=$JAVA_HOME"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium and UiAutomator2 driver
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2
          appium --version

      - name: Download MyDemoApp APK
        run: |
          mkdir -p src/test/resources/apps
          curl -L -f --retry 3 --retry-delay 5 \
            "https://github.com/saucelabs/my-demo-app-android/releases/download/2.7.1/mda-2.7.1-25.apk" \
            -o src/test/resources/apps/MyDemoApp.apk
          ls -lh src/test/resources/apps/MyDemoApp.apk
          echo "APP_PATH=${{ github.workspace }}/src/test/resources/apps/MyDemoApp.apk" >> $GITHUB_ENV

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}

      - name: Build Maven project
        run: mvn clean compile -B

      - name: Run Appium tests with Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          avd-name: test_device
          force-avd-creation: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            echo "=== Emulator Info ==="
            adb devices
            adb shell getprop ro.build.version.sdk

            echo "=== APK Info ==="
            echo "APK path: $APP_PATH"
            ls -lh "$APP_PATH"

            echo "=== Pre-install APK on emulator ==="
            adb install "$APP_PATH" || echo "Pre-install skipped (Appium will handle it)"

            echo "=== Starting Appium Server ==="
            nohup appium \
              --address 127.0.0.1 \
              --port 4723 \
              --relaxed-security \
              --allow-insecure chromedriver_autodownload \
              --log-timestamp \
              > appium.log 2>&1 & APPIUM_PID=$!

            echo "Appium PID: $APPIUM_PID"

            echo "=== Waiting for Appium to be ready ==="
            for i in $(seq 1 40); do
              if curl -sf http://127.0.0.1:4723/status > /dev/null 2>&1; then
                echo "Appium ready at attempt $i"
                break
              fi
              if [ $i -eq 40 ]; then
                echo "ERROR: Appium failed to start after 40 attempts"
                cat appium.log
                exit 1
              fi
              sleep 2
            done

            echo "=== Running Maven Tests ==="
            mvn test -B; TEST_EXIT=$?

            echo "=== Appium Log (last 100 lines) ==="
            tail -100 appium.log || true

            kill $APPIUM_PID 2>/dev/null || true
            exit $TEST_EXIT
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
          APP_PATH: ${{ github.workspace }}/src/test/resources/apps/MyDemoApp.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/screenshots/
          retention-days: 7

      - name: Test Results Summary
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "target/surefire-reports" ]; then
            TOTAL=$(grep -l 'testcase' target/surefire-reports/TEST-*.xml 2>/dev/null | wc -l)
            TESTS=$(grep -r 'tests=' target/surefire-reports/TEST-*.xml 2>/dev/null | grep -oP 'tests="\K[0-9]+' | paste -sd+ | bc 2>/dev/null || echo "N/A")
            FAILURES=$(grep -r 'failures=' target/surefire-reports/TEST-*.xml 2>/dev/null | grep -oP 'failures="\K[0-9]+' | paste -sd+ | bc 2>/dev/null || echo "N/A")
            ERRORS=$(grep -r 'errors=' target/surefire-reports/TEST-*.xml 2>/dev/null | grep -oP 'errors="\K[0-9]+' | paste -sd+ | bc 2>/dev/null || echo "N/A")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Test Suites | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | $TESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| Failures | $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No Surefire reports found." >> $GITHUB_STEP_SUMMARY
          fi
