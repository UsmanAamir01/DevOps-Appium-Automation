name: Appium Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Run Appium Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Pin JAVA_HOME to JDK 17 globally
        run: |
          echo "JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> $GITHUB_ENV
          echo "PATH=${{ steps.setup-java.outputs.path }}/bin:$PATH" >> $GITHUB_ENV
          echo "Pinned JAVA_HOME=${{ steps.setup-java.outputs.path }}"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium and UiAutomator2 driver
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2
          appium --version

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Maven project
        run: mvn clean compile -B

      - name: Run Appium tests with Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            echo "=== Environment ==="
            echo "JAVA_HOME=$JAVA_HOME"
            java -version
            adb devices

            echo "=== Starting Appium server ==="
            nohup appium --address 127.0.0.1 --port 4723 --relaxed-security --log-timestamp > appium.log 2>&1 &
            APPIUM_PID=$!
            echo "Appium PID: $APPIUM_PID"

            echo "=== Waiting for Appium to be ready ==="
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:4723/status > /dev/null 2>&1; then
                echo "Appium server is ready (attempt $i)"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "ERROR: Appium server failed to start"
                cat appium.log
                exit 1
              fi
              sleep 2
            done

            echo "=== Running Maven tests ==="
            mvn test -B || TEST_EXIT=$?

            echo "=== Appium server log (last 50 lines) ==="
            tail -50 appium.log || true

            kill $APPIUM_PID 2>/dev/null || true
            exit ${TEST_EXIT:-0}
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/screenshots/
          retention-days: 7
