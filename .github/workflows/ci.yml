name: Appium Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Run Appium Tests (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Maven project
        run: mvn clean compile -B

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android emulator with Appium (Docker)
        run: |
          docker compose up -d android-emulator
          echo "Waiting for emulator + Appium to be healthy..."
          timeout 600 bash -c 'until docker compose ps android-emulator | grep -q "healthy"; do echo "Waiting..."; sleep 15; done'
          echo "Emulator is healthy!"
          docker compose ps

      - name: Run tests against Docker emulator
        run: |
          mvn test -B \
            -Dappium.url=http://localhost:4723 \
            || true
          TEST_EXIT=${PIPESTATUS[0]}
          echo "TEST_EXIT=$TEST_EXIT" >> $GITHUB_ENV
        env:
          APPIUM_URL: "http://localhost:4723"
          DEVICE_NAME: "emulator-5554"
          APP_PATH: "/root/tmp/MyDemoApp.apk"
          CI: "true"
          DOCKER_MODE: "true"

      - name: Generate Allure report
        if: always()
        run: mvn allure:report -B || true

      - name: Docker emulator logs
        if: always()
        run: docker compose logs android-emulator --tail=200 > docker-emulator.log 2>&1 || true

      - name: Stop Docker containers
        if: always()
        run: docker compose down --volumes --remove-orphans || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 14

      - name: Upload Docker emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-emulator-log
          path: docker-emulator.log
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/screenshots/
          retention-days: 7

      - name: Test Results Summary
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🐳 **Docker-based execution** using \`budtmo/docker-android\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "target/surefire-reports" ]; then
            TESTS=$(grep -r 'tests=' target/surefire-reports/TEST-*.xml 2>/dev/null | grep -oP 'tests="\K[0-9]+' | paste -sd+ | bc 2>/dev/null || echo "N/A")
            FAILURES=$(grep -r 'failures=' target/surefire-reports/TEST-*.xml 2>/dev/null | grep -oP 'failures="\K[0-9]+' | paste -sd+ | bc 2>/dev/null || echo "N/A")
            ERRORS=$(grep -r 'errors=' target/surefire-reports/TEST-*.xml 2>/dev/null | grep -oP 'errors="\K[0-9]+' | paste -sd+ | bc 2>/dev/null || echo "N/A")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | $TESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| Failures | $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No Surefire reports found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check test results
        if: always()
        run: |
          if [ "${{ env.TEST_EXIT }}" != "0" ]; then
            echo "Tests failed with exit code ${{ env.TEST_EXIT }}"
            exit 1
          fi
