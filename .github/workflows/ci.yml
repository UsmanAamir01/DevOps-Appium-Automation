name: Appium Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Run Appium Tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Enable KVM for Docker Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Build Maven project (compile check)
        run: mvn clean compile -B

      - name: Run Dockerized Appium tests
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from tests 2>&1 | tee docker-output.log
          TEST_EXIT=${PIPESTATUS[0]}
          echo "TEST_EXIT=$TEST_EXIT" >> $GITHUB_ENV

      - name: Capture Docker logs
        if: always()
        run: |
          docker compose logs android-emulator > docker-emulator.log 2>&1 || true
          docker compose logs tests > docker-tests.log 2>&1 || true

      - name: Stop Docker containers
        if: always()
        run: docker compose down --volumes --remove-orphans || true

      - name: Generate Allure report (host)
        if: always()
        run: mvn allure:report -B 2>/dev/null || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 14

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            docker-output.log
            docker-emulator.log
            docker-tests.log
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/screenshots/
          retention-days: 7

      - name: Test Results Summary
        if: always()
        run: |
          echo "## 🐳 Docker CI Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Execution: \`budtmo/docker-android:emulator_11.0\` + Maven test runner" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "target/surefire-reports" ]; then
            TESTS=$(grep -r 'tests=' target/surefire-reports/TEST-*.xml 2>/dev/null | grep -oP 'tests="\K[0-9]+' | paste -sd+ | bc 2>/dev/null || echo "N/A")
            FAILURES=$(grep -r 'failures=' target/surefire-reports/TEST-*.xml 2>/dev/null | grep -oP 'failures="\K[0-9]+' | paste -sd+ | bc 2>/dev/null || echo "N/A")
            ERRORS=$(grep -r 'errors=' target/surefire-reports/TEST-*.xml 2>/dev/null | grep -oP 'errors="\K[0-9]+' | paste -sd+ | bc 2>/dev/null || echo "N/A")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Tests | $TESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| Failures | $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No test reports found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if tests failed
        if: always()
        run: |
          if [ "${{ env.TEST_EXIT }}" != "0" ] && [ "${{ env.TEST_EXIT }}" != "" ]; then
            echo "Tests failed with exit code ${{ env.TEST_EXIT }}"
            exit 1
          fi
